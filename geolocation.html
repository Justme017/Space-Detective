<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation Service</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            max-width: 400px;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status {
            font-size: 16px;
            line-height: 1.5;
        }
        .success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner" id="spinner"></div>
        <h2>Fetching your location...</h2>
        <p id="status" class="status">Please allow access to your location</p>
        <div id="result"></div>
    </div>

    <script>
        function updateStatus(message, isError = false, isSuccess = false) {
            const statusEl = document.getElementById('status');
            const spinnerEl = document.getElementById('spinner');
            const resultEl = document.getElementById('result');
            
            statusEl.textContent = message;
            
            if (isError) {
                statusEl.className = 'status error';
                spinnerEl.style.display = 'none';
            } else if (isSuccess) {
                statusEl.className = 'status success';
                spinnerEl.style.display = 'none';
            }
        }

        function getLocation() {
            console.log('Starting geolocation request...');
            
            if (!navigator.geolocation) {
                const errorMessage = 'Geolocation not supported by browser';
                updateStatus(errorMessage, true);
                
                // Send error to parent window
                window.parent.postMessage({
                    error: errorMessage
                }, '*');
                return;
            }

            updateStatus('Getting your location...');
            
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    console.log('Geolocation success:', position);
                    
                    const locationData = {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        accuracy: position.coords.accuracy,
                        timestamp: position.timestamp
                    };
                    
                    updateStatus('✅ Location found! Sending to app...', false, true);
                    
                    // Show coordinates for debugging
                    document.getElementById('result').innerHTML = `
                        <div class="success">
                            <strong>Location Found:</strong><br>
                            Lat: ${position.coords.latitude.toFixed(6)}<br>
                            Lon: ${position.coords.longitude.toFixed(6)}<br>
                            Accuracy: ±${position.coords.accuracy.toFixed(0)}m
                        </div>
                    `;
                    
                    // Send data to parent window
                    console.log('Sending location data:', locationData);
                    window.parent.postMessage(locationData, '*');
                },
                function(error) {
                    console.error('Geolocation error:', error);
                    
                    let errorMessage = '';
                    let suggestion = '';
                    
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMessage = 'Location access denied by user';
                            suggestion = 'Please click the location icon in your browser and allow location access';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMessage = 'Location information unavailable';
                            suggestion = 'Try: 1) Check your internet connection, 2) Enable location services, 3) Try a different browser, 4) Make sure GPS/WiFi is enabled';
                            break;
                        case error.TIMEOUT:
                            errorMessage = 'Location request timed out';
                            suggestion = 'Location took too long to detect. Try refreshing the page';
                            break;
                        default:
                            errorMessage = 'Unknown location error: ' + error.message;
                            suggestion = 'Please try refreshing the page or use a different browser';
                    }
                    
                    updateStatus('❌ ' + errorMessage, true);
                    
                    // Show more detailed error info
                    document.getElementById('result').innerHTML = `
                        <div class="error">
                            <strong>Error Details:</strong><br>
                            Code: ${error.code}<br>
                            Message: ${error.message}<br><br>
                            <strong>💡 Try this:</strong><br>
                            ${suggestion}
                        </div>
                    `;
                    
                    // Try again with different settings if it was a position unavailable error
                    if (error.code === error.POSITION_UNAVAILABLE) {
                        setTimeout(() => {
                            updateStatus('🔄 Retrying with different settings...');
                            
                            navigator.geolocation.getCurrentPosition(
                                function(position) {
                                    console.log('Retry successful:', position);
                                    
                                    const locationData = {
                                        latitude: position.coords.latitude,
                                        longitude: position.coords.longitude,
                                        accuracy: position.coords.accuracy,
                                        timestamp: position.timestamp
                                    };
                                    
                                    updateStatus('✅ Location found on retry!', false, true);
                                    
                                    document.getElementById('result').innerHTML = `
                                        <div class="success">
                                            <strong>Location Found (Retry):</strong><br>
                                            Lat: ${position.coords.latitude.toFixed(6)}<br>
                                            Lon: ${position.coords.longitude.toFixed(6)}<br>
                                            Accuracy: ±${position.coords.accuracy.toFixed(0)}m
                                        </div>
                                    `;
                                    
                                    console.log('Sending retry location data:', locationData);
                                    window.parent.postMessage(locationData, '*');
                                },
                                function(retryError) {
                                    console.error('Retry also failed:', retryError);
                                    // Send the original error
                                    window.parent.postMessage({
                                        error: errorMessage,
                                        code: error.code,
                                        retryFailed: true
                                    }, '*');
                                },
                                {
                                    enableHighAccuracy: true,  // Try high accuracy on retry
                                    timeout: 45000,
                                    maximumAge: 600000  // Allow older cache on retry
                                }
                            );
                        }, 3000);  // Wait 3 seconds before retry
                    } else {
                        // Send error to parent window
                        console.log('Sending error:', errorMessage);
                        window.parent.postMessage({
                            error: errorMessage,
                            code: error.code
                        }, '*');
                    }
                },
                {
                    enableHighAccuracy: false,  // Try with lower accuracy first
                    timeout: 30000,  // Increase timeout to 30 seconds
                    maximumAge: 300000  // Allow cached location up to 5 minutes old
                }
            );
        }

        // Start geolocation when page loads
        console.log('Page loaded, starting geolocation...');
        window.addEventListener('load', getLocation);
        
        // Also try immediately in case load event already fired
        if (document.readyState === 'complete') {
            getLocation();
        }
    </script>
</body>
</html>
