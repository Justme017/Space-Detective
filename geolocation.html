<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation Service</title>
    <style>
        :root {
            --primary-bg: #1a2a45;
            --secondary-bg: #2a4a65;
            --text-color: #f0f8ff;
            --success-color: #28a745;
            --error-color: #dc3545;
            --loader-color: #007bff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--primary-bg);
            color: var(--text-color);
            margin: 0;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 2rem;
            background: var(--secondary-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        #status {
            font-size: 1.1rem;
            margin: 1.5rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 123, 255, 0.3);
            border-top-color: var(--loader-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .success { color: var(--success-color); }
        .error { color: var(--error-color); }
        #retryBtn {
            background-color: var(--loader-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            display: none; /* Hidden by default */
        }
        #details {
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Geolocation Service</h1>
        <div id="status"><div class="loader"></div>Requesting location...</div>
        <div id="details"></div>
        <button id="retryBtn" onclick="requestLocation()">Try Again</button>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const detailsEl = document.getElementById('details');
        const retryBtn = document.getElementById('retryBtn');
        let isRequesting = false;

        const updateUI = (state, message, details = '') => {
            statusEl.className = state;
            statusEl.innerHTML = message;
            detailsEl.innerHTML = details;
            retryBtn.style.display = (state === 'error') ? 'block' : 'none';
        };

        const postMessageToParent = (data) => {
            // Allow all origins for flexibility, but in production, this should be restricted.
            const targetOrigin = '*'; 
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(data, targetOrigin);
            }
        };

        const handleSuccess = (position) => {
            const { latitude, longitude, accuracy } = position.coords;
            const locationData = { latitude, longitude, accuracy: Math.round(accuracy) };
            
            updateUI('success', '✅ Location Found!', `Lat: ${latitude.toFixed(4)}, Lon: ${longitude.toFixed(4)}`);
            postMessageToParent(locationData);
            isRequesting = false;
        };

        const handleError = (error) => {
            const messages = {
                [error.PERMISSION_DENIED]: "Permission denied. Please enable location services.",
                [error.POSITION_UNAVAILABLE]: "Location unavailable. Check network or GPS.",
                [error.TIMEOUT]: "Request timed out. Please try again."
            };
            const errorMessage = messages[error.code] || "An unknown error occurred.";
            
            updateUI('error', `❌ ${errorMessage}`);
            postMessageToParent({ error: errorMessage, code: error.code });
            isRequesting = false;
        };

        const requestLocation = () => {
            if (isRequesting) return;
            isRequesting = true;

            updateUI('loading', '<div class="loader"></div>Requesting location...', 'Please grant permission when prompted.');

            if (!navigator.geolocation) {
                handleError({ code: 0, message: "Geolocation is not supported by this browser." });
                return;
            }

            navigator.geolocation.getCurrentPosition(handleSuccess, handleError, {
                enableHighAccuracy: true,
                timeout: 15000, // 15 seconds
                maximumAge: 0 // Force a fresh location
            });
        };

        // Automatically request location on load.
        window.addEventListener('load', requestLocation);

        // Listen for retry requests from the parent application.
        window.addEventListener('message', (event) => {
            if (event.data === 'requestLocation') {
                requestLocation();
            }
        });
    </script>
</body>
</html>
